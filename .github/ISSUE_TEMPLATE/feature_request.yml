name: Feature request
description: Suggest an improvement or new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please
        [search existing issues](https://github.com/Kntnt/kntnt-html-to-markdown/issues?q=is%3Aissue)
        first to avoid duplicates.

        Note: this library is a **faithful port** of the Go library
        [`JohannesKaufmann/html-to-markdown`](https://github.com/JohannesKaufmann/html-to-markdown).
        Requests that change conversion output are most likely to be accepted
        when they keep the port aligned with upstream behaviour.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem would this solve? What are you trying to do that you cannot do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen. Include an example HTML input and the Markdown you would expect, if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have thought about.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — links to upstream behaviour, related issues, references.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
